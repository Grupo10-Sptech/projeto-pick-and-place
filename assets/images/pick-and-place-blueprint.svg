<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <style>
      .arm-base-motion {
        transform-box: view-box;
        transform-origin: 586px 474px;
        animation: arm-base-cycle 7s cubic-bezier(.45, 0, .2, 1) infinite;
      }

      .arm-shoulder-motion {
        transform-box: view-box;
        transform-origin: 489px 371px;
        animation: arm-shoulder-cycle 7s cubic-bezier(.45, 0, .2, 1) infinite;
      }

      .arm-wrist-motion {
        transform-box: view-box;
        transform-origin: 718px 400px;
        animation: arm-wrist-cycle 7s cubic-bezier(.45, 0, .2, 1) infinite;
      }

      .gripper-left-motion {
        transform-box: view-box;
        transform-origin: 718px 500px;
        animation: gripper-left-cycle 7s ease-in-out infinite;
      }

      .gripper-right-motion {
        transform-box: view-box;
        transform-origin: 756px 500px;
        animation: gripper-right-cycle 7s ease-in-out infinite;
      }

      .product-motion {
        animation: product-flow 7s linear infinite;
      }

      .product-motion-delayed {
        animation-delay: -3.5s;
      }

      .belt-flow {
        animation: belt-flow 1.4s linear infinite;
      }

      .status-light {
        animation: status-pulse .7s ease-in-out infinite alternate;
      }

      .scanline {
        animation: scan-cycle 3.2s ease-in-out infinite;
      }

      .circuit-pulse {
        animation: circuit-pulse 3.6s ease-in-out infinite;
      }

      .circuit-flow {
        animation: circuit-flow 2.8s linear infinite;
      }

      @keyframes arm-base-cycle {
        0%, 8%, 100% { transform: rotate(0deg); }
        26% { transform: rotate(-13deg); }
        43% { transform: rotate(-13deg); }
        65% { transform: rotate(9deg); }
        81% { transform: rotate(9deg); }
      }

      @keyframes arm-shoulder-cycle {
        0%, 8%, 100% { transform: rotate(0deg); }
        26% { transform: rotate(16deg); }
        43% { transform: rotate(16deg); }
        65% { transform: rotate(-12deg); }
        81% { transform: rotate(-12deg); }
      }

      @keyframes arm-wrist-cycle {
        0%, 14%, 100% { transform: rotate(0deg); }
        32%, 45% { transform: rotate(-19deg); }
        65%, 80% { transform: rotate(15deg); }
      }

      @keyframes gripper-left-cycle {
        0%, 33%, 55%, 100% { transform: translateX(-4px); }
        39%, 49% { transform: translateX(4px); }
      }

      @keyframes gripper-right-cycle {
        0%, 33%, 55%, 100% { transform: translateX(4px); }
        39%, 49% { transform: translateX(-4px); }
      }

      @keyframes product-flow {
        0%, 10% { transform: translateX(0); opacity: 1; }
        34% { transform: translateX(135px); opacity: 1; }
        52% { transform: translateX(135px); opacity: 1; }
        78% { transform: translateX(280px); opacity: 1; }
        94%, 100% { transform: translateX(310px); opacity: 0; }
      }

      @keyframes belt-flow {
        0%, 34% { stroke-dashoffset: 0; }
        52% { stroke-dashoffset: -18; }
        100% { stroke-dashoffset: -44; }
      }

      @keyframes status-pulse {
        from { opacity: .48; }
        to { opacity: 1; }
      }

      @keyframes scan-cycle {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: .75; }
        90% { opacity: .55; }
        100% { transform: translateY(330px); opacity: 0; }
      }

      @keyframes circuit-pulse {
        0%, 100% { opacity: .58; }
        50% { opacity: 1; }
      }

      @keyframes circuit-flow {
        to { stroke-dashoffset: -56; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
    <linearGradient id="frame" x1="200" y1="120" x2="960" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42dfd0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#82aaff" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="panel" x1="270" y1="150" x2="900" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42dfd0" stop-opacity=".15"/>
      <stop offset="1" stop-color="#82aaff" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="arm" x1="410" y1="470" x2="790" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82aaff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#42dfd0" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="belt" width="18" height="18" patternTransform="rotate(-20)" patternUnits="userSpaceOnUse">
      <path d="M0 0v18" stroke="#82aaff" stroke-opacity=".22" stroke-width="3"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#42dfd0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#42dfd0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#42dfd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

