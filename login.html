<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acessar — Pick-and-Place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <button class="theme-toggle auth-theme-toggle" id="themeToggle" type="button"
          aria-label="Ativar tema claro" title="Ativar tema claro">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.5A8.5 8.5 0 0 1 8.5 3.8 8.5 8.5 0 1 0 20.2 15.5Z"></path>
            <path d="m16.5 3 .5 1.5 1.5.5-1.5.5-.5 1.5L16 5.5l-1.5-.5 1.5-.5.5-1.5Z"></path>
          </svg>
        </button>
        <img class="auth-logo auth-logo-dark" src="images/vibra-data-logo-dark.png" alt="Vibra Data" />
        <img class="auth-logo auth-logo-light" src="images/vibra-data-logo-light.png" alt="" aria-hidden="true" />
        <h1>Acesse sua conta</h1>
        <p class="auth-description">Entre para acompanhar os indicadores da máquina.</p>

        <form id="loginForm" class="auth-form">
          <label>
            E-mail
            <input name="email" type="email" autocomplete="email" required maxlength="254" />
          </label>
          <label>
            Senha
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Acessar</button>
        </form>

        <p class="auth-switch">Ainda não tem uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
      </section>
    </main>
    <script type="module" src="./assets/js/login.js"></script>
  </body>
</html>
